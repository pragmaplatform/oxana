[package]
name = "oxanus-macros"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "DEPRECATED: renamed to oxana-macros. Use oxana-macros 2.x instead."
homepage = "https://github.com/pragmaplatform/oxana"
repository = "https://github.com/pragmaplatform/oxana"
documentation = "https://docs.rs/oxana-macros/latest/oxana_macros/"

[lib]
proc-macro = true

[dependencies]
darling = "0.23"
heck = { version = "0.5", default-features = false }
proc-macro-error2 = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2", features = ["parsing", "proc-macro", "derive"] }

[features]
default = []
registry = []
