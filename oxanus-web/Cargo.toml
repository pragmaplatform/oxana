[package]
name = "oxanus-web"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "DEPRECATED: renamed to oxana-web. Use oxana-web 2.x instead."
homepage = "https://github.com/pragmaplatform/oxana"
repository = "https://github.com/pragmaplatform/oxana"
documentation = "https://docs.rs/oxana-web/latest/oxana_web/"
keywords = ["job", "scheduler", "worker", "web"]
categories = ["asynchronous", "web-programming"]
exclude = [".*", "logo.jpg"]

[lib]
doctest = false
test = true

[dependencies]
oxanus = { workspace = true }

askama = "0.15"
askama_web = { version = "0.15", features = ["axum-0.8"] }
axum = "0.8"
chrono = { version = "^0.4", features = ["serde"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0", features = ["preserve_order"] }
urlencoding = "2"
uuid = { version = "^1.23", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
oxanus = { path = "../oxanus", default-features = false, features = [
    "registry",
] }
serde = { version = "^1.0", features = ["derive"] }
thiserror = "^2.0"
tokio = { version = "^1.52", features = ["full"] }
