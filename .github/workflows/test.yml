name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      redis:
        image: redis:8
        command: redis-server --save "" --appendonly no
        ports:
          - 6379:6379

    env:
      CARGO_TERM_COLOR: always
      REDIS_URL: redis://localhost:6379
      RUST_LOG: trace

    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Format
        run: cargo fmt --all --check

      - name: Feature dependencies
        run: |
          cargo tree -p oxana --no-default-features -e normal > core-dependencies.txt
          if grep -q sentry core-dependencies.txt; then exit 1; fi
          cargo tree -p oxana -p oxana-web -p oxana-mcp -e features,no-dev > workspace-features.txt
          if grep -q 'oxana feature "sentry-panic"' workspace-features.txt; then exit 1; fi

      - name: Test
        run: |
          cargo check -p oxana --no-default-features
          cargo test -p oxana --lib --test panic_reporting --no-default-features
          cargo check -p oxana --no-default-features --features sentry
          cargo test -p oxana --lib --test panic_reporting --no-default-features --features sentry
          cargo check -p oxana --no-default-features --features sentry-panic
          cargo test -p oxana --lib --test panic_reporting --no-default-features --features sentry-panic
          cargo check -p oxana --no-default-features --features sentry,sentry-panic
          cargo test -p oxana --lib --test panic_reporting --no-default-features --features sentry,sentry-panic
          cargo test -p oxana --lib --test panic_reporting
          cargo check --workspace --all-features
          cargo test -p oxana-mcp --all-targets
          cargo nextest run --workspace --all-features --no-fail-fast

      - name: Lint
        run: cargo clippy --all-features --workspace --all-targets -- -D warnings

      - name: Benchmark
        run: cargo bench
        env:
          RUST_LOG: "off"

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          cargo publish -p oxana-macros || true
          cargo publish -p oxana || true
          cargo publish -p oxana-web || true
          cargo publish -p oxana-mcp || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
