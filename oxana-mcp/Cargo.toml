[package]
name = "oxana-mcp"
version = "2.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only MCP server for monitoring Oxana job queues."
repository = "https://github.com/pragmaplatform/oxana"
keywords = ["job", "queue", "mcp", "monitoring"]
categories = ["asynchronous", "web-programming"]

[dependencies]
oxana = { workspace = true }
axum = "0.8"
chrono = "0.4"
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"

[dev-dependencies]
tokio = { version = "^1.52", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
